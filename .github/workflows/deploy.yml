name: IPTV 更新并部署到 Cloudflare Pages

on:
  schedule:
    - cron: "5 */12 * * *"      # 每 12 小时自动更新一次
  workflow_dispatch:            # 也可在 Actions 页面手动触发一次

permissions:
  contents: read
  actions: read

concurrency:
  group: iptv-cf-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出本仓库（含 scripts/ 构建脚本）
        uses: actions/checkout@v4

      - name: 构建干净全量中文直播源（CCTV + 卫视 + 地方台）
        run: |
          mkdir -p site
          python3 scripts/build_clean_m3u.py
          ls -la site
          head -5 site/result.m3u

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=jakmz-iptv --branch=main --commit-dirty=true
