[Settings]
; ===== 全局功能 =====
open_update = True
open_epg = True
language = zh_CN

; ===== 定时自动维护（每 12 小时重抓+测速一次，启动即跑一次）=====
update_mode = interval
update_interval = 12
update_startup = True
time_zone = Asia/Shanghai

; ===== 协议 & 输出 =====
ipv_type = all
ipv_type_prefer = ipv4
output_urls_limit = 5

; ===== 服务端口（当前版容器内部固定 8080；compose 已映射 8000:8080）=====
open_service = True
service_port = 8080

; ===== 输出 M3U 结果（播放器需要的标准格式）=====
; 开启后才生成 output/result.m3u；缺失则 workflow 兜底由 result.txt 转换
open_m3u_result = True

; ===== 过滤：硬性保障"无广告/无垃圾源/无成人台" =====
; 1) 广告/循环占位源过滤（含 #EXT-X-ENDLIST 短循环、片段带广告关键字的源直接剔除）
open_filter_ad = True
; 2) 分辨率过滤：低于 720p 的卡顿/水印源丢掉
open_filter_resolution = True
min_resolution = 1280x720
; 3) 速率过滤：低于 0.5 MiB/s 的慢源丢掉
open_filter_speed = True
min_speed = 0.5

; ===== 频道模板（关键：只输出你勾选的干净频道，模板不含成人台）=====
; 默认 demo.txt 仅含 央视/卫视/广东；首次启动后开 WebUI(:8000) 勾选更多分组：
;   央视频道 / 卫视频道 / 港·澳·台 / 电影 / 咪咕 / 体育 / 动画 / 游戏 / 音乐 / 经典剧场
; 模板里没列的频道（含任何成人台）在"对频道"阶段就被丢弃，不会进结果。
source_file = config/demo.txt
